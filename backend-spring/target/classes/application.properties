# Server settings
server.port=8080

# Database Configuration (Defaults to in-memory H2 database; can override via environment variables for Supabase/PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:farmersdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Government of India Agmarknet API Config
# Note: Use your resource ID from data.gov.in. The default resource is the general market commodity prices.
gov.api.url=${GOV_API_URL:https://api.data.gov.in/resource/35985678-0d79-46b4-9ed6-6f13308a1d24}
gov.api.key=${GOV_API_KEY:579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b}

# Supabase REST client configuration (for direct HTTP API if desired, though we primarily use PostgreSQL JDBC)
supabase.url=${SUPABASE_URL:https://your-project.supabase.co}
supabase.key=${SUPABASE_SERVICE_ROLE_KEY:}

# Caching and scheduler configurations
app.cache.refresh-rate-ms=1800000
app.api.timeout-ms=15000

# Logging configurations
logging.level.org.springframework.web=INFO
logging.level.com.farmersportal=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
