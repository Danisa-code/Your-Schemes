# Server settings
server.port=8080

# Database Configuration (Defaults to in-memory H2 database; can override via environment variables for Supabase/PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:farmersdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Government of India Agmarknet API Config
# Note: Use your resource ID from data.gov.in. The default resource is the general market commodity prices.
gov.api.url=${GOV_API_URL:https://api.data.gov.in/resource/35985678-0d79-46b4-9ed6-6f13308a1d24}
gov.api.key=${GOV_API_KEY:579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b}

# Supabase REST client configuration (for direct HTTP API if desired, though we primarily use PostgreSQL JDBC)
supabase.url=${SUPABASE_URL:https://your-project.supabase.co}
supabase.key=${SUPABASE_SERVICE_ROLE_KEY:}

# Caching and scheduler configurations
app.cache.refresh-rate-ms=1800000
app.api.timeout-ms=15000

# Java Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
mail.from=${MAIL_FROM:no-reply@farmersportal.tn.gov.in}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000

# JWT Security Configurations
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}



# WebOTP App Domain Configuration
app.domain=${APP_DOMAIN:localhost:3000}

# TextBee SMS Gateway Configuration
# Get your API key from: https://app.textbee.dev/dashboard
# 1. Register at https://app.textbee.dev/register (free)
# 2. Install TextBee app on your Android phone
# 3. Register your device in the dashboard
# 4. Generate an API key and paste it below (or set TEXTBEE_API_KEY env var)
textbee.api-key=${TEXTBEE_API_KEY:}

# Logging configurations
logging.level.org.springframework.web=INFO
logging.level.com.farmersportal=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
